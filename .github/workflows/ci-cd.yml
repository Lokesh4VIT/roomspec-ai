name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lightweight image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: WITH_CLIP=false
          tags: roomspec-ai:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name roomspec -p 8000:8000 -e EMBEDDING_BACKEND=hash roomspec-ai:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/v1/health && break; sleep 2; done
          curl -fsS -X POST localhost:8000/api/v1/bom -H 'content-type: application/json' \
            -d '{"max_width_cm": 240, "budget_usd": 2000, "finish_style": "Natural Oak"}' | python -m json.tool | head -40
          docker logs roomspec | tail -20

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping deploy."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
