# Render Blueprint. CLIP needs ~1.5-2GB RAM loaded — the free plan (512MB) cannot
# run it, hence the earlier WITH_CLIP=false/EMBEDDING_BACKEND=hash. This config
# assumes you've moved to a plan with enough RAM (see "manual steps" below).
services:
  - type: web
    name: roomspec-ai
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    dockerCommand: null
    envVars:
      - key: WITH_CLIP
        value: "true"
      - key: EMBEDDING_BACKEND
        value: clip
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIT_PROVIDER
        value: gemini
      - key: API_KEYS
        sync: false
      - key: ADMIN_API_KEYS
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CORS_ORIGINS
        sync: false
