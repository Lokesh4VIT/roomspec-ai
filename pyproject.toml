[project]
name = "roomspec-ai"
version = "1.0.0"
description = "AI-powered interior dimension & material specification engine"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["._*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI dependency defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/v1/routes.py" = ["E501"]  # inline SVG markup
"scripts/generate_seed.py" = ["E501"]  # catalog tables
